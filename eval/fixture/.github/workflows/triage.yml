name: AI triage
on: issue_comment
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          prompt: "Triage this issue: ${{ github.event.comment.body }}"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
